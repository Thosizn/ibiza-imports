<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiza Imports — Camisas de Time Importadas</title>
  <meta name="description" content="Ibiza Imports: camisas de futebol tailandesas 1.1 premium de times brasileiros, europeus e seleções. Personalização com nome e número e pedido pelo WhatsApp." />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" type="image/png" href="assets/img/emblem.png" />
  <link rel="apple-touch-icon" href="assets/img/emblem.png" />

  <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ibiza Imports" />
  <meta property="og:title" content="Ibiza Imports — Camisas de Time Importadas" />
  <meta property="og:description" content="Camisas tailandesas 1.1 premium de clubes brasileiros, europeus e seleções. Peça pelo WhatsApp." />
  <meta property="og:image" content="assets/img/logo.jpg" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Vercel Speed Insights -->
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/dist/index.mjs';
    injectSpeedInsights();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="preload" as="image" href="assets/img/logo.jpg" fetchpriority="high" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- Os componentes fixos (header, carrinho lateral, menu mobile, footer)
       e as páginas são renderizados via JavaScript dentro destes contêineres. -->
  <div id="header-root"></div>
  <div id="mobile-menu-root"></div>
  <div id="cart-drawer-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>

  <main id="app" class="app" tabindex="-1"></main>

  <div id="footer-root"></div>

  <!-- Ordem de carregamento: config e dados → utilitários → estado → componentes → páginas → router → app -->
  <script src="js/config.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/data/teams.js"></script>
  <script src="js/data/products.js"></script>

  <script src="js/utils.js"></script>
  <script src="js/services/catalog.js"></script>
  <script src="js/services/cart.js"></script>

  <script src="js/components/icons.js"></script>
  <script src="js/components/button.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/mobileMenu.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/placeholderCard.js"></script>
  <script src="js/components/categoryCard.js"></script>
  <script src="js/components/teamRail.js"></script>
  <script src="js/components/sizeSelector.js"></script>
  <script src="js/components/quantitySelector.js"></script>
  <script src="js/components/cartItem.js"></script>
  <script src="js/components/cartDrawer.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/flyToCart.js"></script>
  <script src="js/components/sectionHeader.js"></script>
  <script src="js/components/emptyState.js"></script>
  <script src="js/components/requestBanner.js"></script>

  <script src="js/pages/home.js"></script>
  <script src="js/pages/catalog.js"></script>
  <script src="js/pages/product.js"></script>
  <script src="js/pages/cart.js"></script>
  <script src="js/pages/notFound.js"></script>

  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
